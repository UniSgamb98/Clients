<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title description">
  <title id="title">Schema riassuntivo del database Clients</title>
  <desc id="description">Diagramma delle 19 tabelle Apache Derby previste dal progetto, suddivise per area funzionale e collegate tramite le principali chiavi esterne.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#102b46"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020817" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#73869d"/>
    </marker>
    <style>
      .title { font: 700 42px Inter,Segoe UI,sans-serif; fill: #f8fbff; }
      .subtitle { font: 400 19px Inter,Segoe UI,sans-serif; fill: #adc1d8; }
      .section { font: 700 18px Inter,Segoe UI,sans-serif; letter-spacing: 1.5px; }
      .table-name { font: 700 17px ui-monospace,SFMono-Regular,Consolas,monospace; fill: #f8fbff; }
      .details { font: 400 14px Inter,Segoe UI,sans-serif; fill: #bfd0df; }
      .key { font: 600 12px ui-monospace,SFMono-Regular,Consolas,monospace; fill: #d8e8f5; }
      .count { font: 700 14px Inter,Segoe UI,sans-serif; fill: #071426; }
      .relation { fill: none; stroke: #73869d; stroke-width: 2; opacity: .65; marker-end: url(#arrow); }
      .relation.strong { stroke: #67e8f9; stroke-width: 3; opacity: .8; }
      .card { fill: #112a41; stroke-width: 2; rx: 14; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1800" height="1280" fill="url(#background)"/>
  <circle cx="1580" cy="-30" r="360" fill="#164e63" opacity=".22"/>
  <circle cx="160" cy="1220" r="310" fill="#312e81" opacity=".18"/>

  <text x="54" y="66" class="title">Clients · schema database</text>
  <text x="54" y="99" class="subtitle">19 tabelle Apache Derby · UUID in CHAR(36) · relazioni principali e cancellazioni in cascata</text>
  <g transform="translate(1540 38)">
    <rect width="205" height="54" rx="27" fill="#67e8f9"/>
    <text x="102.5" y="34" text-anchor="middle" class="count">19 TABELLE</text>
  </g>

  <!-- Intestazioni delle aree funzionali -->
  <text x="54" y="155" class="section" fill="#c4b5fd">CONFIGURAZIONE · 7</text>
  <text x="474" y="155" class="section" fill="#67e8f9">CLIENTI E RELAZIONI · 5</text>
  <text x="894" y="155" class="section" fill="#86efac">RECAPITI · 5</text>
  <text x="1314" y="155" class="section" fill="#fcd34d">STORICO · 2</text>

  <!-- Relazioni: disegnate dietro le schede -->
  <g aria-label="Relazioni tra tabelle">
    <path class="relation strong" d="M 834 252 C 860 252, 860 252, 894 252"/>
    <path class="relation strong" d="M 834 252 C 1050 252, 1080 724, 1314 724"/>
    <path class="relation" d="M 414 220 C 450 220, 445 252, 474 252"/>
    <path class="relation" d="M 414 304 C 446 304, 446 252, 474 252"/>
    <path class="relation" d="M 414 388 C 540 388, 420 396, 474 396"/>
    <path class="relation" d="M 414 472 C 520 472, 420 480, 474 480"/>
    <path class="relation" d="M 414 556 C 540 556, 420 564, 474 564"/>
    <path class="relation" d="M 414 724 C 448 724, 448 648, 474 648"/>
    <path class="relation" d="M 834 252 C 860 252, 860 336, 894 336"/>
    <path class="relation" d="M 834 252 C 860 252, 860 420, 894 420"/>
    <path class="relation" d="M 834 252 C 860 252, 860 504, 894 504"/>
    <path class="relation" d="M 834 252 C 860 252, 860 588, 894 588"/>
    <path class="relation" d="M 1254 336 C 1280 336, 1280 420, 1254 420"/>
    <path class="relation" d="M 1254 336 C 1280 336, 1280 504, 1254 504"/>
    <path class="relation" d="M 834 252 C 1110 252, 1050 724, 1314 724"/>
    <path class="relation" d="M 834 252 C 1130 252, 1100 808, 1314 808"/>
    <path class="relation" d="M 1494 766 L 1494 766"/>
    <path class="relation" d="M 414 220 C 1020 120, 1220 724, 1314 724"/>
    <path class="relation" d="M 414 220 C 1000 130, 1200 808, 1314 808"/>
  </g>

  <!-- Configurazione -->
  <g transform="translate(54 178)">
    <rect class="card" width="360" height="72" stroke="#8b5cf6"/>
    <text x="20" y="29" class="table-name">OPERATORI</text><text x="20" y="53" class="details">Utenti, accesso e assegnazione clienti</text>
  </g>
  <g transform="translate(54 262)">
    <rect class="card" width="360" height="72" stroke="#8b5cf6"/>
    <text x="20" y="29" class="table-name">TIPI_CLIENTE</text><text x="20" y="53" class="details">Classificazione dell’anagrafica</text>
  </g>
  <g transform="translate(54 346)">
    <rect class="card" width="360" height="72" stroke="#8b5cf6"/>
    <text x="20" y="29" class="table-name">STATI_TRATTATIVA</text><text x="20" y="53" class="details">Fasi del rapporto commerciale</text>
  </g>
  <g transform="translate(54 430)">
    <rect class="card" width="360" height="72" stroke="#8b5cf6"/>
    <text x="20" y="29" class="table-name">FORNI</text><text x="20" y="53" class="details">Catalogo: tecnologia, marca, modello</text>
  </g>
  <g transform="translate(54 514)">
    <rect class="card" width="360" height="72" stroke="#8b5cf6"/>
    <text x="20" y="29" class="table-name">FRESATORI</text><text x="20" y="53" class="details">Catalogo: marca e modello</text>
  </g>
  <g transform="translate(54 598)">
    <rect class="card" width="360" height="72" stroke="#8b5cf6"/>
    <text x="20" y="29" class="table-name">CANALI_DI_ACQUISTO</text><text x="20" y="53" class="details">Modalità di acquisto e annotazioni</text>
  </g>
  <g transform="translate(54 682)">
    <rect class="card" width="360" height="72" stroke="#8b5cf6"/>
    <text x="20" y="29" class="table-name">MATERIALI_DI_CONSUMO</text><text x="20" y="53" class="details">Catalogo: materiale, marchio, modello</text>
  </g>

  <!-- Clienti e tabelle ponte -->
  <g transform="translate(474 178)">
    <rect class="card" width="360" height="148" stroke="#22d3ee"/>
    <text x="20" y="31" class="table-name">CLIENTI</text>
    <text x="20" y="57" class="details">Anagrafica centrale del dominio</text>
    <line x1="20" y1="72" x2="340" y2="72" stroke="#31546d"/>
    <text x="20" y="96" class="key">PK  ID</text>
    <text x="20" y="120" class="key">FK  OPERATORE_ID → OPERATORI</text>
  </g>
  <g transform="translate(474 346)">
    <rect class="card" width="360" height="72" stroke="#22d3ee"/>
    <text x="20" y="29" class="table-name">CLIENTI_FORNI</text><text x="20" y="53" class="details">Cliente ↔ forno · anno · nota</text>
  </g>
  <g transform="translate(474 430)">
    <rect class="card" width="360" height="72" stroke="#22d3ee"/>
    <text x="20" y="29" class="table-name">CLIENTI_FRESATORI</text><text x="20" y="53" class="details">Cliente ↔ fresatore · nota</text>
  </g>
  <g transform="translate(474 514)">
    <rect class="card" width="360" height="72" stroke="#22d3ee"/>
    <text x="20" y="29" class="table-name">CLIENTI_MATERIALI</text><text x="20" y="53" class="details">Cliente ↔ materiale · consumo · frequenza</text>
  </g>
  <g transform="translate(474 598)">
    <rect class="card" width="360" height="72" stroke="#22d3ee"/>
    <text x="20" y="29" class="table-name">CLIENTI_PREFERITI</text><text x="20" y="53" class="details">Operatore ↔ cliente preferito</text>
  </g>

  <!-- Recapiti -->
  <g transform="translate(894 294)">
    <rect class="card" width="360" height="72" stroke="#4ade80"/>
    <text x="20" y="29" class="table-name">CONTATTI_CLIENTE</text><text x="20" y="53" class="details">Persone e riferimenti del cliente</text>
  </g>
  <g transform="translate(894 378)">
    <rect class="card" width="360" height="72" stroke="#4ade80"/>
    <text x="20" y="29" class="table-name">TELEFONI_CLIENTE</text><text x="20" y="53" class="details">Numeri del cliente o di un contatto</text>
  </g>
  <g transform="translate(894 462)">
    <rect class="card" width="360" height="72" stroke="#4ade80"/>
    <text x="20" y="29" class="table-name">EMAIL_CLIENTE</text><text x="20" y="53" class="details">E-mail del cliente o di un contatto</text>
  </g>
  <g transform="translate(894 546)">
    <rect class="card" width="360" height="72" stroke="#4ade80"/>
    <text x="20" y="29" class="table-name">INDIRIZZI_CLIENTE</text><text x="20" y="53" class="details">Sedi e indirizzo principale</text>
  </g>
  <g transform="translate(894 630)">
    <rect class="card" width="360" height="72" stroke="#4ade80"/>
    <text x="20" y="29" class="table-name">SITI_WEB_CLIENTE</text><text x="20" y="53" class="details">Siti e presenze web</text>
  </g>

  <!-- Storico -->
  <g transform="translate(1314 682)">
    <rect class="card" width="432" height="72" stroke="#fbbf24"/>
    <text x="20" y="29" class="table-name">NOTE_CLIENTE</text><text x="20" y="53" class="details">Testo, autore e date di creazione/modifica</text>
  </g>
  <g transform="translate(1314 766)">
    <rect class="card" width="432" height="96" stroke="#fbbf24"/>
    <text x="20" y="29" class="table-name">INTERAZIONI</text>
    <text x="20" y="53" class="details">Contatti, follow-up e coinvolgimento</text>
    <text x="20" y="77" class="key">FK CLIENTE · OPERATORE · NOTA</text>
  </g>

  <!-- Nota di lettura e legenda -->
  <g transform="translate(54 920)">
    <rect width="1692" height="270" rx="22" fill="#091b2d" stroke="#28445d" stroke-width="2"/>
    <text x="30" y="45" class="section" fill="#f8fbff">COME LEGGERE LO SCHEMA</text>
    <g transform="translate(30 73)">
      <circle cx="8" cy="8" r="8" fill="#67e8f9"/><text x="28" y="14" class="details">CLIENTI è il nodo centrale; quasi tutti i dati operativi dipendono dalla sua chiave primaria.</text>
      <circle cx="8" cy="48" r="8" fill="#8b5cf6"/><text x="28" y="54" class="details">Le tabelle catalogo descrivono opzioni riutilizzabili e risorse possedute o utilizzate dai clienti.</text>
      <circle cx="8" cy="88" r="8" fill="#4ade80"/><text x="28" y="94" class="details">Recapiti, note, interazioni e associazioni vengono eliminati in cascata con il cliente.</text>
      <circle cx="8" cy="128" r="8" fill="#fbbf24"/><text x="28" y="134" class="details">I riferimenti all’operatore diventano NULL se l’operatore viene eliminato; lo storico cliente rimane coerente.</text>
    </g>
    <g transform="translate(1115 72)">
      <rect width="520" height="140" rx="15" fill="#10283e"/>
      <text x="22" y="32" class="key">DATABASE  Apache Derby</text>
      <text x="22" y="61" class="key">NOME      Clients</text>
      <text x="22" y="90" class="key">IDENTIFICATORI  UUID / CHAR(36)</text>
      <text x="22" y="119" class="key">INDICI    22</text>
    </g>
  </g>
  <text x="900" y="1242" text-anchor="middle" class="details">Vista riassuntiva basata su src/main/resources/db/clienti_schema.sql</text>
</svg>
